<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Token Encryptor</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#1f2937}
  .box{max-width:720px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{margin-top:0}.note{background:#fff7ed;padding:12px;border-radius:10px;line-height:1.7}
  label{display:block;font-weight:700;margin:16px 0 7px}
  input,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
  button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;cursor:pointer}
  textarea{min-height:90px;font-family:Consolas,monospace;direction:ltr;text-align:left}
  .result{display:none;margin-top:20px}
  .ok{color:#166534;font-weight:700}
  .small{font-size:13px;color:#6b7280;line-height:1.6}

/* ============================================================
   SY50RA Tools — Homepage Visual Theme
   Visual-only layer. Existing functionality is untouched.
   ============================================================ */
:root{
  --bg:#07111f;
  --bg2:#0d1b2e;
  --card:rgba(18,34,56,.72);
  --border:rgba(255,255,255,.10);
  --text:#f4f7fb;
  --muted:#9eacc0;
  --accent:#55a7ff;
  --accent2:#7c5cff;
  --shadow:0 24px 70px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  --bg:#f3f7fc;
  --bg2:#e8eef7;
  --card:rgba(255,255,255,.78);
  --border:rgba(18,35,58,.12);
  --text:#102033;
  --muted:#607086;
  --accent:#327fd8;
  --accent2:#6750d8;
  --shadow:0 24px 70px rgba(33,58,91,.14);
}
html,body{min-height:100%;background:
  radial-gradient(circle at 15% 10%,rgba(85,167,255,.18),transparent 28%),
  radial-gradient(circle at 85% 15%,rgba(124,92,255,.16),transparent 30%),
  linear-gradient(135deg,var(--bg),var(--bg2));
  color:var(--text);
}
body{
  position:relative;
  padding:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:36px 36px;
}
.box{
  position:relative;z-index:1;
  width:min(720px,calc(100% - 32px));
  max-width:none;
  margin:78px auto 40px;
  padding:30px;
  border:1px solid var(--border);
  border-radius:26px;
  background:var(--card);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}
h1{margin:0 0 18px;color:var(--text);font-size:28px;font-weight:900}
.note{
  background:rgba(85,167,255,.08);
  border:1px solid rgba(85,167,255,.16);
  padding:14px 16px;
  border-radius:15px;
  line-height:1.8;
  color:var(--text);
}
label{display:block;font-weight:800;margin:18px 0 8px;color:var(--text)}
input,textarea{
  width:100%;box-sizing:border-box;
  padding:13px 14px;
  border:1px solid var(--border);
  border-radius:14px;
  font-size:15px;
  color:var(--text);
  background:rgba(7,17,31,.34);
  outline:none;
  transition:.2s;
}
html[data-theme="light"] input,
html[data-theme="light"] textarea{background:rgba(255,255,255,.72)}
input:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(85,167,255,.12);
}
textarea{
  min-height:90px;
  font-family:Consolas,monospace;
  direction:ltr;text-align:left;
}
button:not(.control-btn){
  margin-top:16px;
  padding:12px 18px;
  border:0;border-radius:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:.22s;
}
button:not(.control-btn):hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}
.result{
  display:none;margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--border);
}
.ok{color:#35d39b;font-weight:800}
.small{font-size:13px;color:var(--muted);line-height:1.7}

.page-controls{
  position:fixed;
  top:22px;
  right:24px;
  z-index:20;
  display:flex;
  gap:8px;
  padding:7px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(10,24,40,.72);
  backdrop-filter:blur(16px);
  box-shadow:0 12px 35px rgba(0,0,0,.22);
}
html[data-theme="light"] .page-controls{background:rgba(255,255,255,.78)}
.control-btn{
  margin:0!important;
  border:0!important;
  background:transparent!important;
  color:var(--muted)!important;
  box-shadow:none!important;
  transform:none!important;
  cursor:pointer;
  padding:9px 12px!important;
  border-radius:11px!important;
  font-weight:700!important;
  font-size:13px!important;
  transition:.2s;
}
.control-btn:hover,.control-btn.active{
  background:rgba(255,255,255,.10)!important;
  color:var(--text)!important;
}
html[data-theme="light"] .control-btn:hover,
html[data-theme="light"] .control-btn.active{
  background:rgba(18,35,58,.08)!important;
}
@media(max-width:700px){
  .box{width:min(100% - 20px,720px);margin:90px auto 25px;padding:22px}
  .page-controls{top:14px;right:10px}
  h1{font-size:23px}
}

</style>

<style id="side-control-style">
.side-control-handle{position:fixed;top:10px;right:0;z-index:99999;width:34px;height:34px;border-radius:12px 0 0 12px;border:1px solid rgba(255,255,255,.12);background:rgba(10,24,40,.82);color:var(--text,#f4f7fb);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(14px);user-select:none;touch-action:none;transition:background .2s ease,box-shadow .2s ease,transform .2s ease}
.side-control-handle:hover{background:rgba(18,34,56,.95);box-shadow:0 10px 28px rgba(0,0,0,.32)}
.side-control-panel{position:fixed;top:10px;right:42px;z-index:99998;display:flex;gap:6px;padding:6px;border:1px solid var(--border,rgba(255,255,255,.1));border-radius:14px;background:rgba(10,24,40,.82);backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,0,0,.25);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(8px);transition:.18s ease}
.side-control-panel.controls-open{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}
.side-control-panel .control-btn{margin:0!important;border:0!important;background:transparent!important;color:var(--muted)!important;box-shadow:none!important;transform:none!important;cursor:pointer;padding:8px 10px!important;border-radius:10px!important;font-weight:700!important;font-size:12px!important;white-space:nowrap}
.side-control-panel .control-btn:hover,.side-control-panel .control-btn.active{background:rgba(255,255,255,.10)!important;color:var(--text)!important}
html[data-theme="light"] .side-control-handle,html[data-theme="light"] .side-control-panel{background:rgba(255,255,255,.86);color:var(--text)}
html[data-theme="light"] .side-control-panel .control-btn:hover,html[data-theme="light"] .side-control-panel .control-btn.active{background:rgba(18,35,58,.08)!important}
</style>
</head>
<body>
<div id="sideControlHandle" class="side-control-handle" aria-label="Controls" title="Click to open • Long press and drag to move">⋮</div>
<div id="sideControlPanel" class="side-control-panel" aria-label="Page controls">
  <button class="control-btn" id="enBtn" type="button" onclick="setLanguage('en')">EN</button>
  <button class="control-btn" id="arBtn" type="button" onclick="setLanguage('ar')">عربي</button>
  <button class="control-btn" id="themeBtn" type="button" onclick="togglePageTheme()">☀️ / 🌙</button>
</div>

<div class="box">
  <h1>GitHub Token Encryptor</h1>
  <div class="note">
    الأداة دي تستخدم نفس طريقة التشفير الموجودة في برنامج Warehouse Scanner:
    <b>AES-GCM + SHA-256</b> مع نفس مفتاح الاشتقاق الموجود داخل البرنامج.
  </div>

  <label>GitHub Personal Access Token</label>
  <input id="token" type="password" autocomplete="off" placeholder="github_pat_... أو ghp_...">

  <button onclick="encryptToken()">تشفير التوكن</button>

  <div id="result" class="result">
    <div class="ok">تم التشفير بنجاح</div>

    <label>encryptedToken</label>
    <textarea id="enc" readonly></textarea>

    <label>iv</label>
    <textarea id="iv" readonly></textarea>

    <div class="small">
      انسخ القيمتين كما هما إلى ملف index_with_users_login.html.
    </div>
  </div>
</div>

<script>
const WH_GITHUB_KEY_PARTS=[
  ['W','H','_','2','0','2','6'].join(''),
  ['S','c','a','n','n','e','r'].join(''),
  ['_','D','i','r','e','c','t'].join(''),
  ['_','G','i','t','H','u','b'].join(''),
  ['_','A','E','S','G','C','M'].join(''),
  ['_','K','3','Y'].join('')
];

function whGitHubKeyMaterial(){
  const a=WH_GITHUB_KEY_PARTS;
  return [a[2],a[0],a[5],a[1],a[4],a[3]].join('|')+'|'+
         ['W','a','r','e','h','o','u','s','e'].reverse().join('');
}

function bytesToBase64(bytes){
  let out='',chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    const part=bytes.subarray(i,Math.min(i+chunk,bytes.length));
    out+=String.fromCharCode.apply(null,part);
  }
  return btoa(out);
}

async function whGitHubCryptoKey(){
  const material=new TextEncoder().encode(whGitHubKeyMaterial());
  const hash=await crypto.subtle.digest('SHA-256',material);
  return crypto.subtle.importKey('raw',hash,{name:'AES-GCM'},false,['encrypt']);
}

async function encryptToken(){
  const token=document.getElementById('token').value.trim();
  if(!token){
    alert('اكتب التوكن أولاً');
    return;
  }

  if(!/^github_pat_[A-Za-z0-9_]+$/.test(token) && !/^ghp_[A-Za-z0-9]+$/.test(token)){
    alert('صيغة GitHub Token غير صحيحة');
    return;
  }

  try{
    const key=await whGitHubCryptoKey();

    // Same IV size used by the decryptor: 12 bytes.
    const iv=crypto.getRandomValues(new Uint8Array(12));

    const data=await crypto.subtle.encrypt(
      {name:'AES-GCM',iv},
      key,
      new TextEncoder().encode(token)
    );

    document.getElementById('enc').value=bytesToBase64(new Uint8Array(data));
    document.getElementById('iv').value=bytesToBase64(iv);
    document.getElementById('result').style.display='block';
  }catch(e){
    alert('حدث خطأ أثناء التشفير: '+e.message);
  }
}

/* SY50RA Tools page preferences — independent of encryption logic */
(function(){
  const savedLang = localStorage.getItem('sysora_language') || 'ar';
  const savedTheme = localStorage.getItem('sysora_theme') || 'dark';

  function applyPageTheme(){
    document.documentElement.setAttribute('data-theme', savedThemeState);
    const b=document.getElementById('themeBtn');
    if(b) b.textContent = savedThemeState === 'dark' ? '☀️' : '🌙';
  }

  function applyPageLanguage(){
    document.documentElement.lang = pageLangState;
    document.documentElement.dir = pageLangState === 'ar' ? 'rtl' : 'ltr';
    const en=document.getElementById('enBtn');
    const ar=document.getElementById('arBtn');
    if(en) en.classList.toggle('active', pageLangState === 'en');
    if(ar) ar.classList.toggle('active', pageLangState === 'ar');
  }

  let pageLangState=savedLang==='en'?'en':'ar';
  let savedThemeState=savedTheme==='light'?'light':'dark';

  window.setLanguage=function(nextLang){
    pageLangState=nextLang==='en'?'en':'ar';
    localStorage.setItem('sysora_language',pageLangState);
    applyPageLanguage();
  };

  window.togglePageTheme=function(){
    savedThemeState=savedThemeState==='dark'?'light':'dark';
    localStorage.setItem('sysora_theme',savedThemeState);
    applyPageTheme();
  };

  applyPageLanguage();
  applyPageTheme();
})();

</script>

<script id="side-control-js">
(function(){
 const h=document.getElementById('sideControlHandle'),p=document.getElementById('sideControlPanel'); if(!h||!p)return;
 const key='sy50ra-controls-position';
 try{const v=JSON.parse(localStorage.getItem(key)||'null');if(v&&Number.isFinite(v.top)&&Number.isFinite(v.right)){h.style.top=v.top+'px';h.style.right=v.right+'px';}}catch(e){}
 function place(){const r=h.getBoundingClientRect();let right=Math.max(8,window.innerWidth-r.left+8);let top=Math.max(8,r.top);p.style.top=top+'px';p.style.right=right+'px';}
 function close(){p.classList.remove('controls-open')}
 h.addEventListener('click',()=>{if(dragged){dragged=false;return} place();p.classList.toggle('controls-open')});
 p.querySelectorAll('.control-btn').forEach(b=>b.addEventListener('click',()=>setTimeout(close,80)));
 document.addEventListener('click',e=>{if(!h.contains(e.target)&&!p.contains(e.target))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 window.addEventListener('resize',()=>{if(p.classList.contains('controls-open'))place()});
 let timer=null,dragging=false,dragged=false,sx=0,sy=0,st=0,sr=0;
 function point(e){return e.touches?e.touches[0]:e}
 function start(e){if(e.button!==undefined&&e.button!==0)return;const q=point(e),r=h.getBoundingClientRect();sx=q.clientX;sy=q.clientY;st=r.top;sr=innerWidth-r.right;dragged=false;clearTimeout(timer);timer=setTimeout(()=>{dragging=true;close();h.style.transition='none'},500)}
 function move(e){const q=point(e),dx=q.clientX-sx,dy=q.clientY-sy;if(!dragging){if(Math.hypot(dx,dy)>8)clearTimeout(timer);return}e.preventDefault();dragged=true;let top=Math.max(8,Math.min(innerHeight-h.offsetHeight-8,st+dy));let right=Math.max(8,Math.min(innerWidth-h.offsetWidth-8,sr-dx));h.style.top=top+'px';h.style.right=right+'px'}
 function end(){clearTimeout(timer);if(dragging){dragging=false;h.style.transition='background .2s ease,box-shadow .2s ease';localStorage.setItem(key,JSON.stringify({top:parseFloat(h.style.top),right:parseFloat(h.style.right)}))}}
 h.addEventListener('mousedown',start);window.addEventListener('mousemove',move,{passive:false});window.addEventListener('mouseup',end);h.addEventListener('touchstart',start,{passive:true});window.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end);window.addEventListener('touchcancel',end);
})();
</script>
</body>
</html>
